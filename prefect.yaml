name: kpis
prefect-version: 2.14.15

build:

push:

pull:
- prefect.deployments.steps.git_clone:
    repository: https://github.com/OOI-CabledArray/kpis.git
    branch: main

deployments:
- name: kpi-pipeline-16vcpu-96gb
  entrypoint: rca_kpis/flow.py:kpi_pipeline
  parameters: {}
  work_pool:
    name: scope-push-pool
    work_queue_name:
    job_variables:
      cpu: 16384
      memory: 98304
      image: public.ecr.aws/p0l4c7i2/rca-kpis:latest
  schedule:
    cron: "0 12 * * 1"   # Mondays 12:00 UTC
    timezone: UTC
  is_schedule_active: true
