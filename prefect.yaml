name: kpis
prefect-version: 2.14.15

build:

push:

pull:
- prefect.deployments.steps.git_clone:
    repository: https://github.com/OOI-CabledArray/kpis.git
    branch: main

deployments:
- name: kpi-pipeline-16vcpu-120gb
  entrypoint: rca_kpis/flow.py:kpi_pipeline
  parameters: {}
  work_pool:
    name: scope-push-pool
    work_queue_name:
    job_variables:
      cpu: 16384
      # Fargate max RAM. C2 is memory-bound, not CPU-bound the heavy 2D stores hit ~28 GB and the heap doesn't shrink between
      # instruments, so 60 GB OOM'd on VEL3DC108. Monthly cadence -> ~$2/run.
      memory: 122880
      image: public.ecr.aws/p0l4c7i2/rca-kpis:latest
  schedule:
    # first Monday of the month, 12:00 UTC. day_or:false ANDs day-of-month with
    # day-of-week -- WITHOUT it, "1-7 * 1" ORs them and fires every Monday too.
    cron: "0 12 1-7 * 1"
    day_or: false
    timezone: UTC
  is_schedule_active: true
